name: Static Analysis

# fallow's changed-file gate. It fails only on findings a change introduces,
# so the pre-existing backlog never blocks a pull request while new dead code,
# duplication, complexity, and boundary violations are stopped at the door.
#
# The full-pipeline command is `bun run analyze`, run locally. Note that
# `fallow --ci` is documented as equivalent to `--fail-on-issues` but was
# measured exiting 0 with findings present, so the local gate uses
# `--fail-on-issues` explicitly.

on:
  pull_request:
  push:
    branches:
      - main
      - major-revision-0526

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: fallow audit (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so the audit can resolve a real base ref to diff against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # --gate new-only is the point of this job: pre-existing findings in a
      # touched file must not fail the build, only findings the change adds.
      - name: Audit changed files
        run: bun x fallow audit --gate new-only
