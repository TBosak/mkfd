      <rect x="457" y="346" width="315" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="475" y="371" class="pillText">Footer + Run-log Filter Fixes</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="90" y="390" width="700" height="312" rx="28" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
