      <text x="120" y="446" class="tierSubtitle">Make every source produce consistent outputs and manageable configs</text>
    
      <rect x="118" y="482" width="650" height="38" rx="19" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
      <text x="136" y="507" class="pillText">Feed Format Refactor</text>
    
      <rect x="118" y="534" width="650" height="38" rx="19" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
