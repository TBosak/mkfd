      <rect x="457" y="811" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="475" y="836" class="pillText">Web Scraping Form Data</text>
    
      <rect x="118" y="863" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="136" y="888" class="pillText">Fetch Policy / Retry / Fallback</text>
    
      <rect x="457" y="863" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="475" y="888" class="pillText">Proxy / User-Agent Profiles</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="90" y="910" width="700" height="312" rx="28" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <rect x="90" y="910" width="700" height="72" rx="28" fill="#ea580c" opacity="0.95"/>
      <path d="M90 954 H790 V982 H90 Z" fill="#ea580c" opacity="0.95"/>
      <text x="120" y="942" class="tierTitle">TIER 3 — Catalog &amp; Import</text>
      <text x="120" y="966" class="tierSubtitle">Make reusable feed recipes safe and shareable</text>
    
      <rect x="118" y="1002" width="650" height="38" rx="19" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="136" y="1027" class="pillText">Parameterized Feed Templates</text>
    
      <rect x="118" y="1054" width="650" height="38" rx="19" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="136" y="1079" class="pillText">Community Catalog</text>
    
      <rect x="118" y="1106" width="650" height="38" rx="19" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="136" y="1131" class="pillText">Catalog Import / Export Flow</text>
    
      <rect x="118" y="1158" width="650" height="38" rx="19" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
      <text x="136" y="1183" class="pillText">Service Connector Request Template</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="90" y="1135" width="700" height="260" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <rect x="90" y="1135" width="700" height="72" rx="28" fill="#16a34a" opacity="0.95"/>
      <path d="M90 1179 H790 V1207 H90 Z" fill="#16a34a" opacity="0.95"/>
      <text x="120" y="1167" class="tierTitle">TIER 4 — New Source Types</text>
      <text x="120" y="1191" class="tierSubtitle">Add new structured and event-driven feed sources</text>
    
      <rect x="118" y="1227" width="315" height="38" rx="19" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="136" y="1252" class="pillText">Sitemap</text>
    
      <rect x="457" y="1227" width="315" height="38" rx="19" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="475" y="1252" class="pillText">Calendar</text>
    
      <rect x="118" y="1279" width="315" height="38" rx="19" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="136" y="1304" class="pillText">GraphQL</text>
    
      <rect x="457" y="1279" width="315" height="38" rx="19" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="475" y="1304" class="pillText">Webhook</text>
    
      <rect x="118" y="1331" width="315" height="38" rx="19" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
      <text x="136" y="1356" class="pillText">Filesystem</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="860" y="1135" width="650" height="312" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <rect x="860" y="1135" width="650" height="72" rx="28" fill="#dc2626" opacity="0.95"/>
      <path d="M860 1179 H1510 V1207 H860 Z" fill="#dc2626" opacity="0.95"/>
      <text x="890" y="1167" class="tierTitle">TIER 5 — Service Connectors</text>
      <text x="890" y="1191" class="tierSubtitle">Build first-class service integrations on the shared substrate</text>
    
      <rect x="888" y="1227" width="650" height="38" rx="19" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
