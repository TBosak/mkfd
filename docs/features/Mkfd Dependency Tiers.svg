      <text x="120" y="671" class="tierSubtitle">Turn discovered sources into usable configured feeds</text>
    
      <rect x="118" y="707" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="136" y="732" class="pillText">Existing Feed Transformer</text>
    
      <rect x="457" y="707" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
