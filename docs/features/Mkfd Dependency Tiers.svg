      <rect x="90" y="150" width="700" height="72" rx="28" fill="#2563eb" opacity="0.95"/>
      <path d="M90 194 H790 V222 H90 Z" fill="#2563eb" opacity="0.95"/>
      <text x="120" y="182" class="tierTitle">TIER 0 — Foundation</text>
      <text x="120" y="206" class="tierSubtitle">Stabilize config, secrets, runtime state, and compatibility</text>
    
      <rect x="118" y="242" width="315" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="136" y="267" class="pillText">Optional Config Value Encryption</text>
    
      <rect x="457" y="242" width="315" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="475" y="267" class="pillText">Feed Configuration Formalization</text>
    
      <rect x="118" y="294" width="315" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="136" y="319" class="pillText">SQLite Runtime Substrate</text>
    
      <rect x="457" y="294" width="315" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="475" y="319" class="pillText">Feed History Migration</text>
    
      <rect x="118" y="346" width="315" height="38" rx="19" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
