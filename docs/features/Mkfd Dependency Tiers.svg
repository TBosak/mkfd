    </g>

      <line x1="440.0" y1="422" x2="440.0" y2="372" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 8"/>
    

      <line x1="440.0" y1="714" x2="440.0" y2="597" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 8"/>
    

      <line x1="440.0" y1="939" x2="440.0" y2="892" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 8"/>
    

