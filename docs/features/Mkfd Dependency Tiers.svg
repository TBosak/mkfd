      <rect x="118" y="759" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="136" y="784" class="pillText">Source Assistant Spine</text>
    
      <rect x="457" y="759" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="475" y="784" class="pillText">Existing-feed Apply Target</text>
    
      <rect x="118" y="811" width="315" height="38" rx="19" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
