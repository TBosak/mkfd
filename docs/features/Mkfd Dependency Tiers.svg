  <path d="M812 1265.0 C 900 1265.0, 740 1291.0, 838 1291.0"
        fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 8"/>
  <text x="875" y="1243.0" class="arrowText">shared source/runtime patterns</text>


  <g filter="url(#shadow)">
    <rect x="860" y="150" width="650" height="265" rx="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="888" y="188" class="noteTitle">What changed</text>
    <text x="888" y="226" class="noteText">• Existing Feed Transformer is no longer deferred.</text>
    <text x="888" y="256" class="noteText">• It ships with basic cleanup transforms, not passthrough only.</text>
    <text x="888" y="286" class="noteText">• Normalized Feed Item Pipeline moves before transformer work.</text>
    <text x="888" y="316" class="noteText">• Source Assistant can apply existing-feed recommendations.</text>
    <text x="888" y="346" class="noteText">• Runtime state remains SQLite-backed, configs remain YAML.</text>
    <text x="888" y="376" class="noteText">• Feed output files remain feedId-based.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="455" width="650" height="280" rx="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="888" y="493" class="noteTitle">Existing Feed Transformer MVP</text>
    <text x="888" y="531" class="noteText">Input: RSS, Atom, or JSON Feed</text>
    <text x="888" y="561" class="noteText">Normalize: shared NormalizedFeedItem[]</text>
    <text x="888" y="591" class="noteText">Clean: descriptions, links, dates, GUIDs, categories</text>
    <text x="888" y="621" class="noteText">Filter: simple include/exclude rules</text>
    <text x="888" y="651" class="noteText">Output: RSS 2.0, Atom, and JSON Feed</text>
    <text x="888" y="681" class="noteText">Observe: run history, item history, feed health</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="775" width="650" height="200" rx="28" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="888" y="813" class="noteTitle">Still deferred</text>
    <text x="888" y="851" class="noteText">• Full universal transform engine</text>
    <text x="888" y="881" class="noteText">• Advanced field expressions / computed fields</text>
    <text x="888" y="911" class="noteText">• Full change detection feed type</text>
    <text x="888" y="941" class="noteText">• Feed merging, splitting, and linked-page enrichment</text>
  </g>


  <text x="90" y="1378" class="small">Mkfd roadmap diagram · Updated for Existing Feed Transformer implementation plan</text>
</svg>
